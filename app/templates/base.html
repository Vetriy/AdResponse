<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} | AdResponse</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="/">
          <span class="brand__mark">AR</span>
          <span>
            <strong>AdResponse</strong>
            <small>первичный ответ клиентам</small>
          </span>
        </a>

        <button class="nav-toggle" type="button" aria-label="Открыть меню" aria-expanded="false" data-nav-toggle>
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="site-nav" data-site-nav>
          <a class="{% if active_page == 'home' %}is-active{% endif %}" href="/">Главная</a>
          <a class="{% if active_page == 'chat' %}is-active{% endif %}" href="/chat/">Чат</a>
          <a class="{% if active_page == 'manager' %}is-active{% endif %}" href="/manager/">Менеджер</a>
          <a class="{% if active_page == 'knowledge' %}is-active{% endif %}" href="/admin/knowledge-base">База знаний</a>
        </nav>
      </header>

      <main>
        {% block content %}{% endblock %}
      </main>
    </div>

    <script src="{{ url_for('static', path='/js/main.js') }}" defer></script>
  </body>
</html>
