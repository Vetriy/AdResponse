{% extends "base.html" %}

{% block content %}
  <section class="page-title">
    <span class="badge badge--peach">Пароль</span>
    <h1>Сброс пароля</h1>
    <p>{% if user %}Пользователь: {{ user.username }}{% else %}Пользователь не найден{% endif %}</p>
  </section>
  {% if user %}
    <section class="form-layout">
      <form class="card form admin-form" method="post" action="/admin/users/{{ user.id }}/reset-password">
        {% if error %}<p class="form-hint">{{ error }}</p>{% endif %}
        <label for="password">Новый пароль</label>
        <input id="password" name="password" type="password" required>
        <div class="actions"><button class="button button--primary" type="submit">Сохранить пароль</button><a class="button button--secondary" href="/admin/users">Отмена</a></div>
      </form>
    </section>
  {% endif %}
{% endblock %}
